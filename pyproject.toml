[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "codesentinel"
version = "0.1.0"
description = "Multi-agent, self-critiquing code review system powered by LangGraph and Groq"
readme = "README.md"
requires-python = ">=3.11,<3.14"

dependencies = [
    # --- Web Framework ---
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "python-multipart>=0.0.12",

    # --- Settings / Validation ---
    "pydantic>=2.9.0",
    "pydantic-settings>=2.6.0",
    "python-dotenv>=1.0.0",

    # --- LLM: Groq + LangChain ---
    "langchain>=0.3.0",
    "langchain-groq>=0.2.0",
    "langchain-core>=0.3.0",
    "langgraph>=0.2.0",

    # --- GitHub API ---
    "PyGithub>=2.4.0",
    "httpx>=0.27.0",

    # --- Queue ---
    "redis[hiredis]>=5.1.0",
    "rq>=1.16.0",

    # --- Database ---
    "sqlalchemy[asyncio]>=2.0.0",
    "asyncpg>=0.30.0",
    "alembic>=1.14.0",

    # --- Static Analysis Tools ---
    "bandit>=1.8.0",
    "ruff>=0.7.0",

    # --- Reliability ---
    "tenacity>=9.0.0",
    "slowapi>=0.1.9",

    # --- Observability ---
    "structlog>=24.4.0",

    # --- Memory (Phase 4) ---
    "chromadb>=0.5.0",

    # --- Utilities ---
    "python-jose[cryptography]>=3.3.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-httpx>=0.32.0",
    "httpx>=0.27.0",
    "ruff>=0.7.0",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
